<html>
	<head>
		<title>Custom Integration</title>
		<script type="module" src="./src/components/counter.ts"></script>
	</head>

	<body>
		<button id="button">Insert / Remove</button>
		<div id="test">
			<my-counter></my-counter>
		</div>

		<script>
			const test = document.getElementById('test');
			const button = document.getElementById('button');
			const template = '<my-counter></my-counter>';
			let hidden = false;

			button.addEventListener('click', () => {
				if (hidden) {
					test.innerHTML = template;
				} else {
					test.innerHTML = '';
				}
				hidden = !hidden;
			});
		</script>
	</body>
</html>
